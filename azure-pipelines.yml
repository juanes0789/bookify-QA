trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  GRADLE_USER_HOME: $(Pipeline.Workspace)/.gradle
  # Azure DevOps variables must define SONAR_ORGANIZATION and SONAR_PROJECT_KEY.
  SONAR_ENABLED: 'true'
  SONAR_SERVICE_CONNECTION: SonarCloud
  SONAR_PROJECT_KEY: bookify

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: Compile
        displayName: Compile application
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - task: JavaToolInstaller@0
            displayName: Use Java 17
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - task: Cache@2
            displayName: Cache Gradle dependencies
            inputs:
              key: 'gradle | "$(Agent.OS)" | gradle/wrapper/gradle-wrapper.properties | **/*.gradle*'
              restoreKeys: |
                gradle | "$(Agent.OS)"
              path: $(GRADLE_USER_HOME)

          - bash: |
              chmod +x ./gradlew
              ./gradlew clean bootJar --no-daemon
            displayName: Build Spring Boot JAR

          - task: PublishPipelineArtifact@1
            displayName: Publish application artifact
            inputs:
              targetPath: $(Build.SourcesDirectory)/build/libs
              artifact: bookify-jar

  - stage: QA
    displayName: Quality assurance
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: Tests
        displayName: Run tests and quality checks
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - task: JavaToolInstaller@0
            displayName: Use Java 17
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - task: Cache@2
            displayName: Cache Gradle dependencies
            inputs:
              key: 'gradle | "$(Agent.OS)" | gradle/wrapper/gradle-wrapper.properties | **/*.gradle*'
              restoreKeys: |
                gradle | "$(Agent.OS)"
              path: $(GRADLE_USER_HOME)

          - bash: |
              chmod +x ./gradlew
              ./gradlew test jacocoTestReport sonar --no-daemon
            displayName: Run tests, coverage and SonarCloud analysis
            env:
              SONAR_TOKEN: $(SONAR_TOKEN)
              SONAR_PROJECT_KEY: $(SONAR_PROJECT_KEY)
              SONAR_ORGANIZATION: $(SONAR_ORGANIZATION)
              SONAR_HOST_URL: https://sonarcloud.io
              SONAR_BRANCH_NAME: $(Build.SourceBranchName)

          - bash: |
              chmod +x ./gradlew
              ./gradlew test jacocoTestReport --no-daemon
            displayName: Run unit tests and JaCoCo without Sonar
            condition: and(succeeded(), ne(variables['SONAR_ENABLED'], 'true'))

          - task: PublishTestResults@2
            displayName: Publish JUnit results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/build/test-results/test/TEST-*.xml'
              failTaskOnFailedTests: true
              testRunTitle: Bookify tests

          - task: PublishCodeCoverageResults@2
            displayName: Publish JaCoCo coverage
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: $(Build.SourcesDirectory)/build/reports/jacoco/test/jacocoTestReport.xml
              pathToSources: $(Build.SourcesDirectory)/src/main/java
              failIfCoverageEmpty: true

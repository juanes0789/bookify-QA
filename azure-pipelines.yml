trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  GRADLE_USER_HOME: $(Pipeline.Workspace)/.gradle
  # Set to true and configure the SonarCloud variables to enable analysis.
  SONAR_ENABLED: 'true'
  SONAR_SERVICE_CONNECTION: SonarCloud
  SONAR_PROJECT_KEY: bookify

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: Compile
        displayName: Compile application
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - task: JavaToolInstaller@0
            displayName: Use Java 17
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - task: Cache@2
            displayName: Cache Gradle dependencies
            inputs:
              key: 'gradle | "$(Agent.OS)" | gradle/wrapper/gradle-wrapper.properties | **/*.gradle*'
              restoreKeys: |
                gradle | "$(Agent.OS)"
              path: $(GRADLE_USER_HOME)

          - bash: |
              chmod +x ./gradlew
              ./gradlew clean bootJar --no-daemon
            displayName: Build Spring Boot JAR

          - task: PublishPipelineArtifact@1
            displayName: Publish application artifact
            inputs:
              targetPath: $(Build.SourcesDirectory)/build/libs
              artifact: bookify-jar

  - stage: QA
    displayName: Quality assurance
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: Tests
        displayName: Run tests and quality checks
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - task: JavaToolInstaller@0
            displayName: Use Java 17
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - task: Cache@2
            displayName: Cache Gradle dependencies
            inputs:
              key: 'gradle | "$(Agent.OS)" | gradle/wrapper/gradle-wrapper.properties | **/*.gradle*'
              restoreKeys: |
                gradle | "$(Agent.OS)"
              path: $(GRADLE_USER_HOME)

          - task: SonarCloudPrepare@3
            displayName: Prepare SonarCloud analysis
            condition: and(succeeded(), eq(variables['SONAR_ENABLED'], 'true'))
            inputs:
              SonarCloud: $(SONAR_SERVICE_CONNECTION)
              organization: $(SONAR_ORGANIZATION)
              scannerMode: other
              extraProperties: |
                sonar.projectKey=$(SONAR_PROJECT_KEY)
                sonar.projectName=Bookify

          - bash: |
              chmod +x ./gradlew
              if [ "$(SONAR_ENABLED)" = "true" ]; then
                ./gradlew sonar --no-daemon
              else
                ./gradlew test jacocoTestReport --no-daemon
              fi

          - task: PublishTestResults@2
            displayName: Publish JUnit results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/build/test-results/test/TEST-*.xml'
              failTaskOnFailedTests: true
              testRunTitle: Bookify tests

          - task: PublishCodeCoverageResults@2
            displayName: Publish JaCoCo coverage
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: $(Build.SourcesDirectory)/build/reports/jacoco/test/jacocoTestReport.xml
              pathToSources: $(Build.SourcesDirectory)/src/main/java
              failIfCoverageEmpty: true

          - task: SonarCloudAnalyze@3
            displayName: Run SonarCloud analysis
            condition: and(succeeded(), eq(variables['SONAR_ENABLED'], 'true'))

          - task: SonarCloudPublish@3
            displayName: Publish SonarCloud quality gate
            condition: and(succeeded(), eq(variables['SONAR_ENABLED'], 'true'))
            inputs:
              pollingTimeoutSec: '300'

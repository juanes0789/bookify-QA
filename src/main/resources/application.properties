spring.application.name=bookify
server.port=${PORT:8080}

# Datos de conexion
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Dialecto y JPA para Hibernate 6+
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Exponer endpoints de Actuator (incluyendo Prometheus)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=read_only

# Exportar / enviar métricas a Grafana Cloud Prometheus (Remote Write)
management.prometheus.metrics.export.push.enabled=true
management.prometheus.metrics.export.push.uri=${GRAFANA_CLOUD_PROMETHEUS_URL:}
management.prometheus.metrics.export.push.username=${GRAFANA_CLOUD_PROMETHEUS_USERNAME:}
management.prometheus.metrics.export.push.password=${GRAFANA_CLOUD_PROMETHEUS_TOKEN:}
management.prometheus.metrics.export.push.step=15s
plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'org.sonarqube' version '7.5.0.8588'
}

group = 'udea.fabrica'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

def envFile = file('.env')
if (envFile.exists()) {
	tasks.named('bootRun') {
		envFile.readLines().each { line ->
			if (line && !line.startsWith('#') && line.contains('=')) {
				def keyVal = line.split('=', 2)
				environment keyVal[0].trim(), keyVal[1].trim()
			}
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = false
	}
}

sonar {
	properties {
		property 'sonar.projectKey', providers.environmentVariable('SONAR_PROJECT_KEY').orElse('bookify').get()
		property 'sonar.projectName', 'Bookify'
		property 'sonar.host.url', providers.environmentVariable('SONAR_HOST_URL').orElse('https://sonarcloud.io').get()
		property 'sonar.coverage.jacoco.xmlReportPaths',
			layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile.absolutePath

		def branchName = providers.environmentVariable('SONAR_BRANCH_NAME').orElse(null).getOrNull()
		if (branchName) {
			property 'sonar.branch.name', branchName
		}

		def branchTarget = providers.environmentVariable('SONAR_BRANCH_TARGET').orElse(null).getOrNull()
		if (branchTarget) {
			property 'sonar.branch.target', branchTarget
		}

		def sonarOrganization = providers.environmentVariable('SONAR_ORGANIZATION').getOrNull()
		if (sonarOrganization) {
			property 'sonar.organization', sonarOrganization
		}
	}
}

tasks.named('sonar') {
	dependsOn tasks.named('jacocoTestReport')
}
